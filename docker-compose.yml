services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: snake_dev
    ports:
      - "18080:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:18080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
